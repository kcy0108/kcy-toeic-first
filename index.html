      { id: "30-23", day: 30, eng: "related", kor: "관련된", type: "형용사", point: "related symptoms (관련 증상)" },

      { id: "30-25", day: 30, eng: "periodically", kor: "주기적으로", type: "부사", point: "offered periodically (주기적으로 제공되는)" },
      { id: "30-26", day: 30, eng: "reaction", kor: "반응", type: "명사", point: "allergic reactions (알레르기 반응), reaction to (~에 대한 반응)" },
      { id: "30-27", day: 30, eng: "simple", kor: "단순한", type: "형용사", point: "simple remedies (단순한 치료법)" },

      { id: "30-29", day: 30, eng: "exposure", kor: "노출", type: "명사", point: "exposure to (~에 대한 노출), be exposed to (~에 노출되다)" },
      { id: "30-30", day: 30, eng: "pharmaceutical", kor: "제약의, 약학의", type: "형용사", point: "pharmaceutical company (제약 회사)" },
      { id: "30-31", day: 30, eng: "premium", kor: "보험료 / 고급의", type: "명사/형용사", point: "insurance premiums (보험료)" },
      { id: "30-32", day: 30, eng: "relieve", kor: "완화시키다", type: "동사", point: "ease(완화시키다)로 대체 가능" },
      { id: "30-33", day: 30, eng: "combination", kor: "결합, 연합", type: "명사", point: "in combination with (~과 더불어, ~과 결합하여)" },
      { id: "30-34", day: 30, eng: "conscious", kor: "알고 있는, 자각하고 있는", type: "형용사", point: "be conscious of (aware로 대체 가능)" },
      { id: "30-35", day: 30, eng: "deprivation", kor: "박탈, 상실", type: "명사", point: "Sleep deprivation (수면 박탈), deprive A of B (A에게서 B를 빼앗다)" },
      { id: "30-36", day: 30, eng: "health", kor: "건강; 번영, 안녕", type: "명사", point: "health insurance (건강 보험), financial health (재정적 안정)" },
      { id: "30-37", day: 30, eng: "induce", kor: "유발하다", type: "동사", point: "cause(유발하다)로 대체 가능" },
      { id: "30-38", day: 30, eng: "insurance", kor: "보험", type: "명사", point: "insurance company (보험 회사), insurance policy (보험 증서)" },
      { id: "30-39", day: 30, eng: "nutrition", kor: "영양", type: "명사", point: "Balanced nutrition (균형 잡힌 영양)" },
      { id: "30-40", day: 30, eng: "prevention", kor: "예방", type: "명사", point: "prevention of illness (질병 예방)" },
      { id: "30-41", day: 30, eng: "susceptible", kor: "~에 감염되기 쉬운, 영향 받기 쉬운", type: "형용사", point: "susceptible to (~에 걸리기 쉬운)" },
      { id: "30-42", day: 30, eng: "uncomfortably", kor: "불쾌하게, 불편하게", type: "부사", point: "became uncomfortably hot (불쾌하게 더워졌다)" }
    ];
    const ranges = [
      '1-3', '4-6', '7-9', '10-12', '13-15', 
      '16-18', '19-21', '22-24', '25-27', '28-30'
    ];

    const App = () => {
      const [currentTab, setCurrentTab] = useState(1);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [wordStatuses, setWordStatuses] = useState({});
      const [isFlipped, setIsFlipped] = useState(false);
      const [learningList, setLearningList] = useState([]);
      const [selectedDay, setSelectedDay] = useState(null); 
      const [isCompleted, setIsCompleted] = useState(false);
      
      const [playbackRate, setPlaybackRate] = useState(1.0);
      const [isPlayingAll, setIsPlayingAll] = useState(false);
      const [touchStart, setTouchStart] = useState({ x: 0, y: 0 });
      const [showHint, setShowHint] = useState(false);

      const [showCanvas, setShowCanvas] = useState(false);
      const [penColor, setPenColor] = useState('#000000');
      const canvasRef = useRef(null);
      const isDrawing = useRef(false);

      const isPlayingAllRef = useRef(isPlayingAll);

      useEffect(() => {
        isPlayingAllRef.current = isPlayingAll;
      }, [isPlayingAll]);

      useEffect(() => {
        const saved = localStorage.getItem('toeic_word_status');
        if (saved) setWordStatuses(JSON.parse(saved));
      }, []);

      const stopPlaying = useCallback(() => {
        setIsPlayingAll(false);
        isPlayingAllRef.current = false;
        window.speechSynthesis.cancel();
      }, []);

      const updateWordStatus = (id, status) => {
        setWordStatuses(prev => {
          const updated = { ...prev, [id]: status };
          localStorage.setItem('toeic_word_status', JSON.stringify(updated));
          return updated;
        });
        
        if (isPlayingAllRef.current) stopPlaying();
        setIsFlipped(false);
        setShowHint(false);
        clearCanvas(); 

        if (currentIndex < learningList.length - 1) {
          setCurrentIndex(prev => prev + 1);
        } else {
          setIsCompleted(true); 
        }
      };

      const speakWord = useCallback((word, autoNext = false) => {
        if (!window.speechSynthesis || !word) return;
        window.speechSynthesis.cancel();
        
        const utterance = new SpeechSynthesisUtterance(word.eng);
        utterance.lang = 'en-US';
        utterance.rate = playbackRate;
        
        utterance.onend = () => {
          if (autoNext && isPlayingAllRef.current) {
            setTimeout(() => {
              if (isPlayingAllRef.current) {
                if (currentIndex < learningList.length - 1) {
                  setIsFlipped(false);
                  setShowHint(false);
                  clearCanvas();
                  setCurrentIndex(prev => prev + 1);
                } else {
                  setIsCompleted(true);
                  stopPlaying();
                }
              }
            }, 1000);
          }
        };
        window.speechSynthesis.speak(utterance);
      }, [playbackRate, currentIndex, learningList, stopPlaying]);

      useEffect(() => {
        if (isPlayingAll && currentTab === 1 && !isCompleted && selectedDay !== null && learningList.length > 0) {
          speakWord(learningList[currentIndex], true);
        }
      }, [currentIndex, isPlayingAll, speakWord, currentTab, learningList, isCompleted, selectedDay]);

      const onTouchStart = (e) => {
        if (showCanvas) return; 
        setTouchStart({ x: e.touches[0].clientX, y: e.touches[0].clientY });
      };

      const onTouchEnd = (e) => {
        if (isCompleted || showCanvas || selectedDay === null || learningList.length === 0) return; 

        const touchEnd = { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
        const dx = touchEnd.x - touchStart.x;
        const dy = touchEnd.y - touchStart.y;
        
        if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 40) {
          if (dx > 0) handlePrev(true);
          else handleNext(true);
        } else if (Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 40) {
          if (!isFlipped && currentTab !== 1) {
            handleFlip(); 
          } else if (isFlipped) {
            if (dy < 0) updateWordStatus(learningList[currentIndex].id, 'O');
            else updateWordStatus(learningList[currentIndex].id, 'X'); 
          }
        }
      };

      const handleDaySelect = (dayStr, targetTab = currentTab) => {
        stopPlaying();
        
        const [start, end] = dayStr.split('-').map(Number);
        const baseList = allVocabData.filter(w => w.day >= start && w.day <= end);

        if (baseList.length === 0) {
            alert(`아직 Day ${dayStr} 단어 데이터가 코드에 추가되지 않았습니다!\n나중에 추가 후 다시 눌러주세요.`);
            return;
        }

        setSelectedDay(dayStr);
        setCurrentIndex(0);
        setIsFlipped(false);
        setShowHint(false);
        setIsCompleted(false);
        clearCanvas();
      };

      const handleTabChange = (tabNum) => {
        setCurrentTab(tabNum);
        if (selectedDay !== null) {
          handleDaySelect(selectedDay, tabNum); // 새로 누른 탭 번호를 파라미터로 즉시 전달
        }
      };

      const handleNext = (isManual = false) => {
        if (isManual && isPlayingAllRef.current) stopPlaying();
        if (currentIndex < learningList.length - 1) {
          setIsFlipped(false);
          setShowHint(false);
          clearCanvas();
          setCurrentIndex(prev => prev + 1);
        } else {
          setIsCompleted(true); 
        }
      };

      const handlePrev = (isManual = false) => {
        if (isManual && isPlayingAllRef.current) stopPlaying();
        if (currentIndex > 0) {
          setIsFlipped(false);
          setShowHint(false);
          clearCanvas();
          setCurrentIndex(prev => prev - 1);
        }
      };

      const handleFlip = () => {
        if (isPlayingAllRef.current) stopPlaying();
        setIsFlipped(true);
      };

      const startDrawing = (e) => {
        if (!showCanvas || !canvasRef.current) return;
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX || e.touches[0].clientX) - rect.left;
        const y = (e.clientY || e.touches[0].clientY) - rect.top;
        
        ctx.beginPath();
        ctx.moveTo(x, y);
        isDrawing.current = true;
      };

      const draw = (e) => {
        if (!isDrawing.current || !showCanvas || !canvasRef.current) return;
        e.preventDefault(); 
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX || e.touches[0].clientX) - rect.left;
        const y = (e.clientY || e.touches[0].clientY) - rect.top;
        
        ctx.lineTo(x, y);
        ctx.strokeStyle = penColor;
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.stroke();
      };

      const endDrawing = () => {
        isDrawing.current = false;
      };

      const clearCanvas = () => {
        if (canvasRef.current) {
          const canvas = canvasRef.current;
          const ctx = canvas.getContext('2d');
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      };

      if (selectedDay === null) {
        const totalWords = allVocabData.length;
        const memorizedCount = Object.values(wordStatuses).filter(s => s === 'O').length;
        const progress = totalWords > 0 ? Math.round((memorizedCount / totalWords) * 100) : 0;

        return (
          <div className="min-h-screen bg-[#F3F4F6] p-6 font-sans flex flex-col" style={{ fontFamily: "'Pretendard', sans-serif" }}>
            <header className="flex justify-between items-center mb-8 bg-white p-4 rounded-xl shadow-sm">
              <h1 className="text-2xl font-bold text-gray-800">해커스 토익 기출 보카 (Day 1~30)</h1>
              <div className="text-sm font-semibold text-gray-500">전체 암기율 {progress}%</div>
            </header>

            <div className="flex bg-white rounded-xl shadow-sm mb-6 p-2 w-full max-w-2xl mx-auto">
              {[1, 2, 3, 4].map(num => (
                <button
                  key={num}
                  onClick={() => setCurrentTab(num)}
                  className={`flex-1 py-3 text-lg font-bold rounded-lg transition-colors ${
                    currentTab === num ? 'bg-blue-100 text-blue-700' : 'text-gray-500'
                  }`}
                >
                  {num}회독
                </button>
              ))}
            </div>

            {/* Day 1부터 Day 30까지 3일치씩 묶은 대시보드 블록들 */}
            <div className="grid grid-cols-2 md:grid-cols-5 gap-4 w-full max-w-6xl mx-auto">
              {ranges.map(range => (
                <div 
                  key={range}
                  onClick={() => handleDaySelect(range)}
                  className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 cursor-pointer hover:border-blue-400 hover:shadow-md transition-all flex flex-col items-center justify-center min-h-[140px]"
                >
                  <h3 className="text-xl font-bold text-gray-800 mb-2">Day {range}</h3>
                  <p className="text-gray-500 text-sm font-medium">총 120단어</p>
                  <div className="mt-3 px-4 py-1 bg-gray-100 text-gray-600 rounded-full text-xs font-semibold">
                    학습 시작
                  </div>
                </div>
              ))}
            </div>
          </div>
        );
      }

      const currentWord = learningList[currentIndex];
      const hintText = currentWord?.eng ? '${currentWord.eng.substring(0, 2)}...' : '';

      return (
        <div className="h-screen bg-[#F3F4F6] flex flex-col font-sans overflow-hidden" style={{ fontFamily: "'Pretendard', sans-serif" }}>
          <header className="bg-white h-14 flex items-center justify-between px-4 border-b shrink-0 shadow-sm">
            <button onClick={() => setSelectedDay(null)} className="text-gray-600 font-bold px-4 py-2 hover:bg-gray-100 rounded-lg">
              ← 목록으로
            </button>
            <div className="font-bold text-gray-800">
              Day {selectedDay} 
              <span className="text-blue-600 ml-2">({currentTab}회독)</span>
            </div>
            <div className="text-gray-500 font-medium">
              {learningList.length > 0 ? `${currentIndex + 1} / ${learningList.length}` : '0 / 0'}
            </div>
          </header>

          <main 
            className="flex-1 flex items-center justify-center p-4 relative"
            style={{ touchAction: showCanvas ? 'none' : 'pan-x' }} 
            onTouchStart={onTouchStart}
            onTouchEnd={onTouchEnd}
          >
            <div className="w-full max-w-4xl bg-white rounded-2xl shadow-md h-full max-h-[600px] flex flex-col relative overflow-hidden">
              
              {learningList.length === 0 ? (
                  <div className="flex-1 flex flex-col items-center justify-center p-8 text-center">
                    <h2 className="text-2xl font-bold text-gray-800 mb-2">4회독 복습 대상이 없습니다!</h2>
                    <p className="text-gray-600">이전 회독에서 틀리거나 애매한 단어가 없습니다.</p>
                  </div>
              ) : isCompleted ? (
                <div className="flex-1 flex flex-col items-center justify-center p-8 animate-fade-in text-center">
                  <div className="text-6xl mb-4">🎉</div>
                  <h2 className="text-2xl font-bold text-gray-800 mb-2">학습 완료!</h2>
                  <button 
                    onClick={() => setSelectedDay(null)} 
                    className="mt-6 bg-blue-600 text-white px-8 py-4 rounded-xl font-bold shadow-md"
                  >
                    대시보드로 돌아가기
                  </button>
                </div>
              ) : (
                <div className="flex-1 flex flex-col items-center justify-center p-8 relative">
                  
                  <canvas
                    ref={canvasRef}
                    width={800}
                    height={400}
                    onMouseDown={startDrawing}
                    onMouseMove={draw}
                    onMouseUp={endDrawing}
                    onMouseLeave={endDrawing}
                    onTouchStart={startDrawing}
                    onTouchMove={draw}
                    onTouchEnd={endDrawing}
                    className={`absolute top-0 left-0 w-full h-full z-10 bg-transparent ${showCanvas ? 'pointer-events-auto' : 'pointer-events-none opacity-0'}`}
                  />

                  {currentTab !== 3 ? (
                    <div className="text-center z-0">
                      <h2 className="text-5xl md:text-6xl font-bold text-gray-900 mb-4">{currentWord.eng}</h2>
                      <button onClick={() => speakWord(currentWord)} className="text-blue-500 text-3xl mb-8">🔊</button>
                      
                      {currentTab === 1 || isFlipped ? (
                        <div className="animate-fade-in">
                          <span className="inline-block bg-gray-100 text-gray-600 px-3 py-1 rounded text-sm font-bold mb-4">
                            {currentWord.type}
                          </span>
                          <p className="text-3xl font-bold text-gray-800 mb-8">{currentWord.kor}</p>
                          <div className="bg-yellow-50 border border-yellow-200 p-5 rounded-xl text-left inline-block min-w-[300px]">
                            <p className="text-sm text-yellow-800 font-bold mb-2">토익 출제 포인트</p>
                            <p className="text-base text-gray-700">{currentWord.point}</p>
                          </div>
                        </div>
                      ) : (
                        <button onClick={handleFlip} className="mt-8 bg-blue-50 text-blue-700 px-10 py-4 rounded-xl font-bold text-xl border border-blue-200">
                          정답 확인하기
                        </button>
                      )}
                    </div>
                  ) : (
                    <div className="text-center z-0">
                      <span className="inline-block bg-gray-100 text-gray-600 px-3 py-1 rounded text-sm font-bold mb-4">
                        {currentWord.type}
                      </span>
                      <p className="text-4xl md:text-5xl font-bold text-gray-900 mb-10 break-keep">{currentWord.kor}</p>
                      
                      {isFlipped ? (
                        <div className="animate-fade-in">
                          <h2 className="text-5xl font-bold text-blue-600 mb-4">{currentWord.eng}</h2>
                          <button onClick={() => speakWord(currentWord)} className="text-blue-500 text-3xl mb-8">🔊</button>
                          <div className="bg-yellow-50 border border-yellow-200 p-5 rounded-xl text-left inline-block min-w-[300px]">
                            <p className="text-base text-gray-700">{currentWord.point}</p>
                          </div>
                        </div>
                      ) : (
                        <div className="flex flex-col gap-4 items-center mt-8">
                             {!showHint ? (
                                 <button onClick={() => setShowHint(true)} className="text-base text-gray-500 underline py-2">첫 글자 힌트 보기</button>
                             ) : (
                                 <p className="text-3xl font-bold text-gray-400 py-2">{hintText}</p>
                             )}
                            <button onClick={handleFlip} className="bg-blue-50 text-blue-700 px-10 py-4 rounded-xl font-bold text-xl border border-blue-200">
                              영어 단어 확인
                            </button>
                        </div>
                      )}
                    </div>
                  )}
                </div>
              )}
            </div>
          </main>

          {!isCompleted && learningList.length > 0 && (
            <footer className="bg-white border-t p-4 flex items-center justify-between shrink-0 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
              <div className="flex gap-2">
                 <button onClick={() => handlePrev(true)} disabled={currentIndex === 0} className="px-4 py-3 bg-gray-100 rounded-lg font-bold text-gray-600 disabled:opacity-30">이전</button>
                 <button onClick={() => handleNext(true)} className="px-4 py-3 bg-gray-100 rounded-lg font-bold text-gray-600">다음</button>
              </div>

              <div className="flex items-center gap-3 bg-gray-50 px-4 py-2 rounded-xl border">
                <button onClick={() => setShowCanvas(!showCanvas)} className={`font-bold text-sm px-3 py-2 rounded-lg ${showCanvas ? 'bg-blue-600 text-white' : 'bg-white text-gray-600 border'}`}>
                  S펜 연습장 {showCanvas ? 'ON' : 'OFF'}
                </button>
                <div className={`flex gap-2 transition-opacity ${showCanvas ? 'opacity-100' : 'opacity-30 pointer-events-none'}`}>
                  {['#000000', '#2563EB', '#16A34A', '#DC2626'].map(color => (
                    <button 
                      key={color} 
                      onClick={() => setPenColor(color)}
                      className={`w-8 h-8 rounded-full border-2 ${penColor === color ? 'border-gray-400 scale-110' : 'border-transparent'}`}
                      style={{ backgroundColor: color }}
                    />
                  ))}
                  <button onClick={clearCanvas} className="w-8 h-8 rounded-full bg-white border border-gray-300 text-gray-500 text-xs font-bold flex items-center justify-center">
                    지움
                  </button>
                </div>
              </div>

              <div className="flex gap-2">
                {currentTab === 1 ? (
                  <button onClick={() => isPlayingAll ? stopPlaying() : setIsPlayingAll(true)} className={`px-6 py-3 rounded-lg font-bold text-white ${isPlayingAll ? 'bg-red-500' : 'bg-gray-800'}`}>
                    {isPlayingAll ? '듣기 중지' : '연속 듣기'}
                  </button>
                ) : (
                  isFlipped && (
                    <>
                      <button onClick={() => updateWordStatus(currentWord.id, 'X')} className="px-6 py-3 bg-red-100 text-red-700 rounded-lg font-bold">❌</button>
                      <button onClick={() => updateWordStatus(currentWord.id, 'TRI')} className="px-6 py-3 bg-yellow-100 text-yellow-700 rounded-lg font-bold">🔺</button>
                      <button onClick={() => updateWordStatus(currentWord.id, 'O')} className="px-6 py-3 bg-blue-100 text-blue-700 rounded-lg font-bold">⭕</button>
                    </>
                  )
                )}
              </div>
            </footer>
          )}
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
