      { id: "03-18", day: 3, eng: "deserve", kor: "~할 만하다, ~할 가치가 있다", type: "동사", point: "well-deserved advancement (응당한 승진)" },
      { id: "03-19", day: 3, eng: "assignment", kor: "일, 임무, 과제", type: "명사", point: "take the assignment (업무를 맡다)" },
      { id: "03-20", day: 3, eng: "entire", kor: "전체의", type: "형용사", point: "the entire team (팀 전체)" },
      { id: "03-21", day: 3, eng: "release", kor: "발표하다, 공개하다; 출시, 발매", type: "동사/명사", point: "press release (보도 자료), release date (출시일)" },
      { id: "03-22", day: 3, eng: "extension", kor: "연장, 연기; (전화의) 내선", type: "명사", point: "grant an extension (연기를 허락하다), extension number (내선 번호)" },
      { id: "03-23", day: 3, eng: "electronically", kor: "컴퓨터 통신망으로, 컴퓨터로", type: "부사", point: "send invoices electronically (송장을 전자로 전송하다)" },
      { id: "03-24", day: 3, eng: "attendance", kor: "출근, 출석", type: "명사", point: "attendance records (출근 기록)" },
      { id: "03-25", day: 3, eng: "absolutely", kor: "절대적으로, 완전히", type: "부사", point: "absolutely necessary (절대적으로 필요한)" },
      { id: "03-26", day: 3, eng: "delegate", kor: "(권한 등을) 위임하다; 대표", type: "동사/명사", point: "delegate(한 명의 대표) vs delegation(집합적 대표단)" },
      { id: "03-27", day: 3, eng: "attentively", kor: "주의 깊게, 조심스럽게", type: "부사", point: "listen attentively (주의 깊게 경청하다)" },
      { id: "03-28", day: 3, eng: "supervision", kor: "감독", type: "명사", point: "supervision(추상명사) / supervisor(감독관 - 사람명사)" },
      { id: "03-29", day: 3, eng: "workshop", kor: "워크숍, 연수", type: "명사", point: "speak at the workshop (워크숍에서 강연하다)" },
      { id: "03-30", day: 3, eng: "draw", kor: "끌다, 끌어당기다", type: "동사", point: "draw praise/inspiration from (~로부터 칭찬/격려를 이끌어내다)" },
      { id: "03-31", day: 3, eng: "revision", kor: "수정, 개정", type: "명사", point: "make a revision (수정하다), revised edition (개정판)" },
      { id: "03-32", day: 3, eng: "reluctantly", kor: "마지못해, 꺼려하여", type: "부사", point: "reluctantly agreed (마지못해 동의하다)" },
      { id: "03-33", day: 3, eng: "acquaint", kor: "~에게 숙지시키다, 잘 알게 하다", type: "동사", point: "acquaint A with B (A에게 B를 숙지시키다 = familiarize A with B)" },
      { id: "03-34", day: 3, eng: "convey", kor: "(용건을) 전달하다", type: "동사", point: "convey A to B (A를 B에게 전달하다)" },
      { id: "03-35", day: 3, eng: "check", kor: "검사하다, 확인하다; 검사", type: "동사/명사", point: "check A for B (B의 유무를 확인하기 위해 A를 검사하다)" },
      { id: "03-36", day: 3, eng: "headquarters", kor: "본부", type: "명사", point: "단복수 동형, 보통 단수 취급" },
      { id: "03-37", day: 3, eng: "file", kor: "(서류를) 철하다; 정식으로 제기하다", type: "동사/명사", point: "file a claim (보험금 등을 청구하다)" },
      { id: "03-38", day: 3, eng: "oversee", kor: "감독하다", type: "동사", point: "supervise와 유의어" },
      { id: "03-39", day: 3, eng: "involved", kor: "관여하는, 관계된, 연루된", type: "형용사", point: "be involved in (~에 관여하다)" },
      { id: "03-40", day: 3, eng: "concentrate", kor: "집중하다, 집중시키다", type: "동사", point: "concentrate on (~에 집중하다 - 자동사), concentrate A on B (타동사)" }
    ];

    const App = () => {
      const [currentTab, setCurrentTab] = useState(1);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [wordStatuses, setWordStatuses] = useState({});
      const [isFlipped, setIsFlipped] = useState(false);
      const [learningList, setLearningList] = useState(vocabData_set1);
      const [selectedDay, setSelectedDay] = useState('ALL');
      
      const [isCompleted, setIsCompleted] = useState(false);
      
      const [playbackRate, setPlaybackRate] = useState(1.0);
      const [isPlayingAll, setIsPlayingAll] = useState(false);
      const [touchStart, setTouchStart] = useState({ x: 0, y: 0 });
      const [showHint, setShowHint] = useState(false);

      const isPlayingAllRef = useRef(isPlayingAll);

      useEffect(() => {
        isPlayingAllRef.current = isPlayingAll;
      }, [isPlayingAll]);

      useEffect(() => {
        const saved = localStorage.getItem('toeic_word_status');
        if (saved) setWordStatuses(JSON.parse(saved));
      }, []);

      const stopPlaying = useCallback(() => {
        setIsPlayingAll(false);
        isPlayingAllRef.current = false;
        window.speechSynthesis.cancel();
      }, []);

      const updateWordStatus = (id, status) => {
        setWordStatuses(prev => {
          const updated = { ...prev, [id]: status };
          localStorage.setItem('toeic_word_status', JSON.stringify(updated));
          return updated;
        });
        
        if (isPlayingAllRef.current) stopPlaying();
        setIsFlipped(false);
        setShowHint(false);

        if (currentIndex < learningList.length - 1) {
          setCurrentIndex(prev => prev + 1);
        } else {
          setIsCompleted(true); 
        }
      };

      const speakWord = useCallback((word, autoNext = false) => {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        
        const utterance = new SpeechSynthesisUtterance(word.eng);
        utterance.lang = 'en-US';
        utterance.rate = playbackRate;
        
        utterance.onend = () => {
          if (autoNext && isPlayingAllRef.current) {
            setTimeout(() => {
              if (isPlayingAllRef.current) {
                if (currentIndex < learningList.length - 1) {
                  setIsFlipped(false);
                  setShowHint(false);
                  setCurrentIndex(prev => prev + 1);
                } else {
                  setIsCompleted(true);
                  stopPlaying();
                }
              }
            }, 1000);
          }
        };
        window.speechSynthesis.speak(utterance);
      }, [playbackRate, currentIndex, learningList, stopPlaying]);

      useEffect(() => {
        if (isPlayingAll && currentTab === 1 && !isCompleted) {
          speakWord(learningList[currentIndex], true);
        }
      }, [currentIndex, isPlayingAll, speakWord, currentTab, learningList, isCompleted]);

      const onTouchStart = (e) => {
        setTouchStart({ x: e.touches[0].clientX, y: e.touches[0].clientY });
      };

      const onTouchEnd = (e) => {
        if (isCompleted) return; 

        const touchEnd = { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
        const dx = touchEnd.x - touchStart.x;
        const dy = touchEnd.y - touchStart.y;
        
        if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 40) {
          if (dx > 0) handlePrev(true);
          else handleNext(true);
        } else if (Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 40) {
          if (!isFlipped && currentTab !== 1) {
            handleFlip(); 
          } else if (isFlipped) {
            if (dy < 0) updateWordStatus(learningList[currentIndex].id, 'O');
            else updateWordStatus(learningList[currentIndex].id, 'X'); 
          }
        }
      };

      const filterByDay = (dayStr, currentList) => {
        if (dayStr === 'ALL') return currentList;
        return currentList.filter(w => w.day === parseInt(dayStr));
      };

      const handleTabChange = (tabNum) => {
        stopPlaying();
        setCurrentTab(tabNum);
        setCurrentIndex(0);
        setIsFlipped(false);
        setShowHint(false);
        setIsCompleted(false); 
        setSelectedDay('ALL'); 

        if (tabNum === 4) {
          let reviewList = vocabData_set1.filter(w => 
            wordStatuses[w.id] === 'X' || wordStatuses[w.id] === 'TRI'
          );
          for (let i = reviewList.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [reviewList[i], reviewList[j]] = [reviewList[j], reviewList[i]];
          }
          setLearningList(reviewList);
        } else {
          setLearningList(vocabData_set1);
        }
      };

      const handleDayFilterChange = (e) => {
        stopPlaying();
        const val = e.target.value;
        setSelectedDay(val);
        setCurrentIndex(0);
        setIsFlipped(false);
        setShowHint(false);
        setIsCompleted(false); 

        if (currentTab === 4) {
          let reviewList = vocabData_set1.filter(w => 
            wordStatuses[w.id] === 'X' || wordStatuses[w.id] === 'TRI'
          );
          setLearningList(filterByDay(val, reviewList));
        } else {
          setLearningList(filterByDay(val, vocabData_set1));
        }
      };

      const handleNext = (isManual = false) => {
        if (isManual && isPlayingAllRef.current) stopPlaying();
        if (currentIndex < learningList.length - 1) {
          setIsFlipped(false);
          setShowHint(false);
          setCurrentIndex(prev => prev + 1);
        } else {
          setIsCompleted(true); 
        }
      };

      const handlePrev = (isManual = false) => {
        if (isManual && isPlayingAllRef.current) stopPlaying();
        if (currentIndex > 0) {
          setIsFlipped(false);
          setShowHint(false);
          setCurrentIndex(prev => prev - 1);
        }
      };

      const handleFlip = () => {
        if (isPlayingAllRef.current) stopPlaying();
        setIsFlipped(true);
      };

      const copyStatus = () => {
        const total = vocabData_set1.length;
        const oks = Object.values(wordStatuses).filter(s => s === 'O').length;
        const text = `🔥오늘의 토익 보카 완료!\n✅ ${oks}/${total} 단어 암기 성공!`;
        navigator.clipboard.writeText(text);
        alert('인증 문구가 복사되었습니다!');
      };

      if (learningList.length === 0) {
        return (
          <div className="min-h-screen bg-gray-50 flex items-center justify-center p-4">
            <div className="text-center">
              <h2 className="text-xl font-bold mb-4">학습할 단어가 없습니다! 🎉</h2>
              <button onClick={() => handleTabChange(1)} className="bg-blue-600 text-white px-6 py-3 rounded-lg font-bold">1회독으로 돌아가기</button>
            </div>
          </div>
        );
      }

      const currentWord = learningList[currentIndex];
      const hintText = currentWord.eng.substring(0, 2) + '...';

      return (
        <div className="min-h-screen bg-gray-100 flex flex-col font-sans" style={{ fontFamily: "'Pretendard', sans-serif" }}>
          <header className="bg-white shadow-sm p-4 sticky top-0 z-10 flex flex-col gap-3">
            <div className="flex justify-between items-center">
                <h1 className="text-xl font-bold text-gray-800">해커스 토익</h1>
                <button onClick={copyStatus} className="text-sm bg-green-100 text-green-700 px-3 py-1.5 rounded-full font-semibold">
                  인증 복사
                </button>
            </div>
            <div className="flex items-center gap-2">
                <span className="text-sm font-bold text-gray-600">범위 필터: </span>
                <select 
                    value={selectedDay} 
                    onChange={handleDayFilterChange}
                    className="text-sm border border-gray-300 rounded px-2 py-1 flex-1 font-medium"
                >
                    <option value="ALL">전체 보기 (Day 1~3)</option>
                    <option value="1">Day 1만 (40단어)</option>
                    <option value="2">Day 2만 (40단어)</option>
                    <option value="3">Day 3만 (40단어)</option>
                </select>
            </div>
          </header>

          <div className="flex bg-white overflow-x-auto shadow-sm border-b">
            {[1, 2, 3, 4].map(num => (
              <button
                key={num}
                onClick={() => handleTabChange(num)}
                className={`flex-1 min-w-[80px] py-3 text-sm font-bold border-b-2 transition-colors ${
                  currentTab === num ? 'border-blue-600 text-blue-600' : 'border-transparent text-gray-500'
                }`}
              >
                {num}회독
              </button>
            ))}
          </div>

          <div className="bg-blue-50 p-3 text-sm text-blue-800 text-center font-medium">
            {currentTab === 1 && "눈으로 빠르게 훑기 (연속 듣기 가능)"}
            {currentTab === 2 && "영어 ➡️ 한글 맞추기 (스와이프 위:O / 아래:X)"}
            {currentTab === 3 && "한글 ➡️ 영어 맞추기 (막히면 힌트 탭)"}
            {currentTab === 4 && "틀린 단어(🔺,❌) 무작위 복습"}
          </div>

          <main 
            className="flex-1 p-4 flex flex-col items-center justify-center max-w-md mx-auto w-full touch-pan-x relative"
            style={{ touchAction: 'pan-x' }}
            onTouchStart={onTouchStart}
            onTouchEnd={onTouchEnd}
          >
            <div className="w-full bg-white rounded-2xl shadow-lg min-h-[380px] p-8 flex flex-col relative justify-center">
              
              {isCompleted ? (
                <div className="text-center p-4 animate-fade-in">
                  <div className="text-6xl mb-4">🎉</div>
                  <h2 className="text-2xl font-bold text-gray-800 mb-2">학습 완료!</h2>
                  <p className="text-gray-600 mb-8 font-medium leading-relaxed">
                    선택하신 범위의 <br /> 모든 단어를 확인했습니다.
                  </p>
                  <button 
                    onClick={() => handleTabChange(currentTab === 4 ? 1 : currentTab + 1)} 
                    className="bg-blue-600 text-white px-6 py-4 rounded-xl font-bold w-full shadow-md active:bg-blue-700 transition-colors"
                  >
                    {currentTab === 4 ? "처음부터 다시 복습하기" : `${currentTab + 1}회독 바로 시작하기`}
                  </button>
                </div>
              ) : (
                <>
                  <div className="absolute top-4 left-4 text-gray-400 font-medium">
                    {currentIndex + 1} / {learningList.length}
                  </div>
                  
                  <div className="absolute top-4 right-4 text-sm font-bold text-gray-400">
                    Day {currentWord.day}
                  </div>

                  {currentTab === 1 ? (
                    <div className="text-center mt-4">
                      <h2 className="text-4xl font-bold text-gray-900 mb-2">{currentWord.eng}</h2>
                      <button onClick={() => speakWord(currentWord)} className="text-blue-500 text-2xl mb-6 active:scale-90 transition-transform">🔊</button>
                      
                      <div className="mt-4">
                        <span className="inline-block bg-gray-100 text-gray-600 px-2 py-1 rounded text-xs font-bold mb-3">
                          {currentWord.type}
                        </span>
                        <p className="text-2xl font-bold text-gray-800 mb-6">{currentWord.kor}</p>
                        <div className="bg-yellow-50 border border-yellow-200 p-4 rounded-xl text-left">
                          <p className="text-xs text-yellow-800 font-bold mb-1">토익 출제 포인트</p>
                          <p className="text-sm text-gray-700 leading-relaxed">{currentWord.point}</p>
                        </div>
                      </div>
                    </div>

                  ) : currentTab === 2 || currentTab === 4 ? (
                    <div className="text-center mt-4">
                      <h2 className="text-4xl font-bold text-gray-900 mb-2">{currentWord.eng}</h2>
                      <button onClick={() => speakWord(currentWord)} className="text-blue-500 text-2xl mb-6 active:scale-90 transition-transform">🔊</button>
                      
                      {isFlipped ? (
                        <div className="mt-4 animate-fade-in">
                          <span className="inline-block bg-gray-100 text-gray-600 px-2 py-1 rounded text-xs font-bold mb-3">
                            {currentWord.type}
                          </span>
                          <p className="text-2xl font-bold text-gray-800 mb-6">{currentWord.kor}</p>
                          <div className="bg-yellow-50 border border-yellow-200 p-4 rounded-xl text-left">
                            <p className="text-xs text-yellow-800 font-bold mb-1">토익 출제 포인트</p>
                            <p className="text-sm text-gray-700 leading-relaxed">{currentWord.point}</p>
                          </div>
                        </div>
                      ) : (
                        <button 
                          onClick={handleFlip}
                          className="mt-8 bg-blue-100 text-blue-700 w-full py-4 rounded-xl font-bold text-lg active:bg-blue-200 transition-colors"
                        >
                          정답 확인하기
                        </button>
                      )}
                    </div>

                  ) : (
                    <div className="text-center mt-4">
                      <span className="inline-block bg-gray-100 text-gray-600 px-2 py-1 rounded text-xs font-bold mb-3">
                        {currentWord.type}
                      </span>
                      <p className="text-3xl font-bold text-gray-900 mb-8 break-keep">{currentWord.kor}</p>
                      
                      {isFlipped ? (
                        <div className="animate-fade-in">
                          <h2 className="text-4xl font-bold text-blue-600 mb-2">{currentWord.eng}</h2>
                          <button onClick={() => speakWord(currentWord)} className="text-blue-500 text-2xl mb-6 active:scale-90 transition-transform">🔊</button>
                          <div className="bg-yellow-50 border border-yellow-200 p-4 rounded-xl text-left">
                            <p className="text-sm text-gray-700 leading-relaxed">{currentWord.point}</p>
                          </div>
                        </div>
                      ) : (
                        <div className="flex flex-col gap-3 mt-8">
                             {!showHint ? (
                                 <button onClick={() => setShowHint(true)} className="text-sm text-gray-500 underline py-2 active:text-gray-800">
                                   첫 글자 힌트 보기
                                 </button>
                             ) : (
                                 <p className="text-2xl font-bold text-gray-400 py-1">{hintText}</p>
                             )}
                            <button 
                              onClick={handleFlip}
                              className="bg-blue-100 text-blue-700 w-full py-4 rounded-xl font-bold text-lg active:bg-blue-200 transition-colors"
                            >
                              영어 단어 확인
                            </button>
                        </div>
                      )}
                    </div>
                  )}
                </>
              )}
            </div>
            
            {!isCompleted && (
              <div className="w-full flex flex-col gap-4 mt-6 px-1">
                <div className="flex justify-between w-full">
                    <button 
                      onClick={() => handlePrev(true)} 
                      disabled={currentIndex === 0} 
                      className={`text-lg font-bold px-4 py-2 ${currentIndex === 0 ? 'text-gray-300' : 'text-blue-600 active:scale-95 transition-transform'}`}
                    >
                      ← 이전 단어
                    </button>
                    <button 
                      onClick={() => handleNext(true)} 
                      className={`text-lg font-bold px-4 py-2 text-blue-600 active:scale-95 transition-transform`}
                    >
                      다음 단어 →
                    </button>
                </div>

                <div className="flex justify-between gap-2 w-full">
                  {currentTab === 1 ? (
                    <>
                      <button 
                        onClick={() => setPlaybackRate(prev => prev === 1.0 ? 0.8 : 1.0)}
                        className="flex-1 bg-white border shadow-sm py-3 rounded-xl font-bold text-gray-700 active:bg-gray-50 transition-colors"
                      >
                        {playbackRate === 1.0 ? '🐇 1.0x' : '🐢 0.8x'}
                      </button>
                      <button 
                        onClick={() => isPlayingAll ? stopPlaying() : setIsPlayingAll(true)}
                        className={`flex-[2] py-3 rounded-xl font-bold text-white shadow-sm transition-colors ${isPlayingAll ? 'bg-red-500 active:bg-red-600' : 'bg-gray-800 active:bg-gray-900'}`}
                      >
                        {isPlayingAll ? '연속 듣기 중지' : '연속 듣기 시작'}
                      </button>
                    </>
                  ) : (
                    isFlipped && (
                      <>
                        <button onClick={() => updateWordStatus(currentWord.id, 'X')} className="flex-1 bg-red-100 text-red-700 py-4 rounded-xl font-bold text-lg active:bg-red-200 transition-colors">❌ 모름</button>
                        <button onClick={() => updateWordStatus(currentWord.id, 'TRI')} className="flex-1 bg-yellow-100 text-yellow-700 py-4 rounded-xl font-bold text-lg active:bg-yellow-200 transition-colors">🔺 애매함</button>
                        <button onClick={() => updateWordStatus(currentWord.id, 'O')} className="flex-1 bg-blue-100 text-blue-700 py-4 rounded-xl font-bold text-lg active:bg-blue-200 transition-colors">⭕ 완벽히 앎</button>
                      </>
                    )
                  )}
                </div>
              </div>
            )}
          </main>
        </div>
      );
    };

    // 앱 실행
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
